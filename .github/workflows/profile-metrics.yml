name: Refresh profile metrics

on:
  schedule:
    - cron: '17 23 * * *' # Around 06:17 Vietnam time; scheduled runs can be delayed.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/profile-metrics.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/profile-metrics.yml'

permissions:
  contents: read

concurrency:
  group: profile-metrics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --test scripts/render-metrics.test.mjs
      - name: Verify static artwork generation
        run: node scripts/render-artwork.mjs
      - name: Verify live API rendering
        run: node scripts/render-metrics.mjs --output "$RUNNER_TEMP/profile-metrics-check"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}

  refresh:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Render public GitHub metrics
        run: node scripts/render-metrics.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
      - name: Commit refreshed assets
        run: |
          git add assets/metrics-light.svg assets/metrics-dark.svg assets/metrics-mobile-light.svg assets/metrics-mobile-dark.svg assets/metrics.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh public profile metrics'
          git push origin HEAD:main
